# instance:data: the releases of the distribution channel, as JSON on stdout.
# reserve_stdout sends every step's logs to stderr; list answers on the kept stdout.
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: reserve stdout
    type: script
    file: "$SERVICE_PATH/instance/scripts/reserve_stdout"
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/scripts/build_context"
    configuration:
      BUILD_CONTEXT_MODE: scope
    output:
      - name: CONTEXT
        type: environment
      - name: PLATFORMS
        type: environment
      - name: DISTRIBUTION_LAYER
        type: environment
      - name: ASSETS_REGION
        type: environment
      - name: SCOPE_CONFIGURATION
        type: environment
      - name: WORKDIR
        type: environment
  - name: setup distribution layer
    type: script
    file: "$SERVICE_PATH/deployment/scripts/layer_executor"
    configuration:
      LAYER_TYPE: distribution
      LAYER_VAR: DISTRIBUTION_LAYER
    output:
      - name: FIREBASE_PROJECT
        type: environment
      - name: FIREBASE_APP_ID_ANDROID
        type: environment
      - name: FIREBASE_APP_ID_IOS
        type: environment
      - name: GOOGLE_APPLICATION_CREDENTIALS
        type: environment
  - name: list releases
    type: script
    file: "$SERVICE_PATH/instance/scripts/list"
