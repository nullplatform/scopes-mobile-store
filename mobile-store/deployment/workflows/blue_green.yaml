# start-blue-green: the initial workflow, refused while another deployment of
# the scope is still rolling out. Firebase App Distribution has no traffic
# split: the release reaches the whole group, as in initial.
# values.yaml comes through initial.yaml.
include:
  - "$SERVICE_PATH/deployment/workflows/initial.yaml"
steps:
  - name: check active rollout
    type: script
    file: "$SERVICE_PATH/deployment/scripts/check_active_rollout"
    before: assume role
