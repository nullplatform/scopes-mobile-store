# rollback-deployment: distribute the previous release again through the
# distribution layer (Firebase cannot unpublish), signed by the signing layer.
# build_context runs in rollback mode: the previous deployment is resolved, the
# assets of the release being rolled back are not (they may be what is broken).
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/scripts/build_context"
    configuration:
      BUILD_CONTEXT_MODE: rollback
    output:
      - name: CONTEXT
        type: environment
      - name: DIMENSION
        type: environment
      - name: PLATFORMS
        type: environment
      - name: CHANNEL
        type: environment
      - name: RELEASE_SEMVER
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: APPLICATION_SLUG
        type: environment
      - name: SIGNING_LAYER
        type: environment
      - name: DISTRIBUTION_LAYER
        type: environment
      - name: ASSETS_BUCKET
        type: environment
      - name: ASSETS_REGION
        type: environment
      - name: SCOPE_CONFIGURATION
        type: environment
      - name: ASSET_TYPE
        type: environment
      - name: PREVIOUS_DEPLOYMENT_ID
        type: environment
      - name: PREVIOUS_RELEASE_SEMVER
        type: environment
      - name: WORKDIR
        type: environment
  - name: setup distribution layer
    type: script
    file: "$SERVICE_PATH/deployment/scripts/layer_executor"
    configuration:
      LAYER_TYPE: distribution
      LAYER_VAR: DISTRIBUTION_LAYER
    output:
      - name: FIREBASE_PROJECT
        type: environment
      - name: FIREBASE_CREDENTIALS_SECRET
        type: environment
      - name: FIREBASE_APP_ID_ANDROID
        type: environment
      - name: FIREBASE_APP_ID_IOS
        type: environment
      - name: GOOGLE_APPLICATION_CREDENTIALS
        type: environment
  - name: rollback
    type: script
    file: "$SERVICE_PATH/deployment/scripts/do_rollback"
