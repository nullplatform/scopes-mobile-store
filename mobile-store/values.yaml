# Operator configuration for every workflow (not shown to developers); each key under
# configuration becomes an environment variable in the steps.
provider_categories:
  - scope-configurations
  - cloud-providers
configuration:
  DEPLOYMENT_MAX_WAIT_IN_SECONDS: 600       # upper bound for a single deployment step before it is failed
  FIREBASE_CLI_VERSION: "14"                # firebase-tools major version installed when the distribution layer is firebase
  WORKDIR: /tmp/mobile-store                # scratch directory where binaries are downloaded and signed
  GATE_POLL_INTERVAL_IN_SECONDS: 300        # how often the gate layer checks the external approval (store review)
  GATE_MAX_WAIT_IN_SECONDS: 259200          # 3 days: give up waiting for the external approval after this
