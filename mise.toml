[tools]
bun = "latest"

# The SDK reads its settings through node-config and, with no config/ directory
# here, falls back to plain env vars; this keeps node-config quiet about it.
[env]
SUPPRESS_NO_CONFIG_WARNING = "1"

# Install is the root of the task graph: every task depends on it, so a fresh
# clone just works without remembering `bun install` first.
[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]

[tasks.describe]
description = "Print the package manifest (what np package publish sends)"
depends = ["install"]
run = "bun src/main.ts --describe"

[tasks.test]
description = "Run the tests: every action in-process through pkg.run(), no AWS, no Firebase, no platform"
depends = ["install"]
run = "bun test"

[tasks.typecheck]
description = "Type-check the sources and the tests"
depends = ["install"]
run = "bunx tsc --noEmit -p ."

[tasks.build]
description = "Compile the worker to a single binary"
depends = ["install"]
run = "bun build --compile src/main.ts --outfile dist/mobile-store"
sources = ["src/**/*.ts", "package.json", "bun.lock"]
outputs = ["dist/mobile-store"]

# `np package dev` → the browser dev UI: every action from the manifest, the
# notification the platform would send as the editor's starting point, live
# output. Runs against a mock platform; never calls the real API.
[tasks.dev]
description = "Run the package with the dev UI"
depends = ["install"]
run = "bunx @nullplatform/plugin-dev-ui --plugin ."

# The worker image: the compiled package on a minimal base. The agent spawns
# it and dials it over gRPC/mTLS, injecting the port, the TLS material and the
# API key at runtime.
[tasks."build:image"]
description = "Build the worker image"
run = "docker build -t mobile-store-worker:dev ."

# `np package run` → run this package the way production does: a controlplane
# agent in Docker (worker backend) that spawns the worker image and streams
# actions to it over gRPC/mTLS. Needs NP_API_KEY. --network host so the agent
# reaches the worker it publishes on the host (Linux; on Docker Desktop enable
# host networking). The CLI hands over NP_PACKAGE_ENV_FLAGS / NP_PACKAGE_ENV_JSON
# so this shell's environment (AWS credentials, MOBILE_STORE_ASSUME_ROLE_ARN=none
# for a developer's own keys) reaches the worker; both are empty under a plain
# `mise run run` and the task still works.
[tasks.run]
description = "Run locally: an agent (docker backend) that spawns this package's worker"
depends = ["build:image"]
run = """
set -eu
: "${NP_API_KEY:?set NP_API_KEY}"
slug="${NP_PACKAGE_SLUG:-mobile-store}"
env_json='{}'
[ -n "${NP_PACKAGE_ENV_JSON:-}" ] && env_json="$NP_PACKAGE_ENV_JSON"
worker_rules='[{"match":{"package":"'"$slug"'"},"env":'"$env_json"'}]'
docker rm -f np-mobile-store-agent >/dev/null 2>&1 || true
stale=$(docker ps -aq --filter "name=np-worker-.*-${slug}-")
[ -n "$stale" ] && docker rm -f $stale >/dev/null 2>&1
# shellcheck disable=SC2086
docker run --rm --name np-mobile-store-agent --network host \
  -v /var/run/docker.sock:/var/run/docker.sock \
  ${NP_PACKAGE_ENV_FLAGS:-} \
  -e NP_API_KEY -e NP_LOG_LEVEL="${NP_LOG_LEVEL:-INFO}" \
  -e NP_WORKER_BACKEND=docker \
  -e NP_WORKER_IMAGE=mobile-store-worker:dev \
  -e NP_WORKER_RULES="$worker_rules" \
  "${NP_AGENT_IMAGE:-public.ecr.aws/nullplatform/controlplane-agent:latest}" \
  -runtime=host -tags=package:"$slug",local:"${NP_LOCAL_USER:-$USER}"
"""
